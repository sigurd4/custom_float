[package]
name = "custom_float"
version = "0.3.1"
edition = "2024"
license = "MIT"
description = "Custom floating-point types"
repository = "https://github.com/sigurd4/custom_float"
keywords = ["float", "number", "custom", "ieee754"]
categories = ["algorithms", "compression", "mathematics", "no-std::no-alloc", "science"]
exclude = ["plots"]

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[features]
default = [
    "bytemuck",
    "ati",
    "g_711",
    "google",
    "ibm",
    "intel",
    "khronos",
    "nvidia",
    "pixar"
]
ati = []
g_711 = []
google = []
ibm = []
intel = []
khronos = []
nvidia = []
pixar = []
bytemuck = ["dep:bytemuck"]
use_std_float = []

[dependencies]
moddef = "0.3.0"
num-traits = "0.2.19"
bytemuck = {version = "1.23.1", features = ["derive"], optional = true}
serde = {version = "*", optional = true}

[dev-dependencies]
num = "0.4.3"
plotters = "0.3.7"
linspace = "0.2.7"
libm = "0.2.15"